modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/team-abnormals/boatload/issues"
license = "https://github.com/team-abnormals/boatload/blob/main/LICENSE.txt"

[[mixins]]
    config = "boatload.mixins.json"

[[mods]]
    modId = "boatload"
    version = "${mod_version}"
    logoFile = "logo.png"
    itemIcon = "boatload:birch_furnace_boat"
    configBackground = "minecraft:textures/block/birch_planks.png"
    authors = "Team Abnormals"
    credits = "Markus1002, bageldotjpg"
    displayURL = "https://www.teamabnormals.com/mods/boatload"
    displayName = "Boatload"
    description = '''
    Adds Furnace Boats and Large Boats to make ocean exploration more interesting and interactive!
    '''

[[dependencies.boatload]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mc_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.boatload]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.boatload]]
    modId = "blueprint"
    type = "required"
    versionRange = "[${blueprint},)"
    ordering = "AFTER"
    side = "BOTH"